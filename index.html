<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- style.css -->
     <link rel="stylesheet" href="./style.css">
    <!-- tailwind -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-pink-800 min-h-screen">
   <section>
    <div>
         <div class="text-center my-10 ">
                <h1 class="text-white text-center text-3xl font-bold mb-6 tracking-wider">Calculator</h1>
                <div id="main" class="bg-white/10 backdrop-blur-lg border border-white/20 p-6 rounded-3xl shadow-2xl text-center ">
                    <div>
                    <input id="result" type="text" class="w-full bg-slate-900 text-white text-right text-3xl p-4 rounded-xl shadow-inner outline-none mb-4" placeholder="0">
                </div>
                <div class="calc-button-row p-4 ">
                    
                    <button type="button" id="seven" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(7)">7</button>
                    <button id="eight" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(8)">8</button>
                    <button id="nine" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(9)">9</button>

                    <button id="mul" class="bg-purple-500 text-white rounded-xl p-3 m-1 shadow-md hover:bg-purple-400 hover:scale-105 transition duration-200 font-bold" onclick="displayNumber('*' )" class="opt">&#215;</button>
                    <br>

                    <button id="four" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(4)">4</button>
                    <button id="five" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(5)">5</button>
                    <button id="six" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(6)">6</button>

                    <button id="sub" class="bg-purple-500 text-white rounded-xl p-3 m-1 shadow-md hover:bg-purple-400 hover:scale-105 transition duration-200 font-bold" onclick="displayNumber('-')">-</button>
                    <br>

                    <button id="one" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(1)">1</button>
                    <button id="two" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(2)">2</button>
                    <button id="three" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(3)">3</button>

                    <button id="add" class="bg-purple-500 text-white rounded-xl p-3 m-1 shadow-md hover:bg-purple-400 hover:scale-105 transition duration-200 font-bold" onclick="displayNumber('+')" class="opt">&#43;</button>
                    <br>

                    <button id="doublezero" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber('00')" class="opt">00</button>
                    <button id="singlrzero" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber(0)" class="opt">0</button>
                    <button id="div" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="displayNumber('.')" class="opt">.</button>
                    
                    <button id="div" class="bg-purple-500 text-white rounded-xl p-3 m-1 shadow-md hover:bg-purple-400 hover:scale-105 transition duration-200 font-bold" onclick="displayNumber('/')">&#247;</button>
                    <br>

                    <button id="ac" class="bg-rose-500 text-white rounded-xl p-3 m-1 hover:bg-rose-400 hover:scale-105 transition duration-200 font-semibold " onclick="clearBox()">AC</button>
                    <button id="del" class="bg-slate-100 text-slate-800 rounded-xl p-3 m-1 shadow-md hover:bg-white hover:scale-105 transition duration-200 font-semibold " onclick="removeLastItem()">&#9003;</button>
                    <button id="equal" class="bg-purple-500 text-white rounded-xl p-3 m-1 shadow-lg hover:scale-105 transition duration-200 font-bold " onclick="evaluteExp()">&#61;</button>
                    
                </div>
                </div>
           
        </div>
    </div>
   </section>
</body>
<script src="./script.js"></script>
</html>
